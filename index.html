<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cfe6f2">
<title>Little Lives</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe6f2; font-family: system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
         display: flex; gap: 12px; align-items: center; background: rgba(255,255,255,.55); backdrop-filter: blur(8px);
         color: #3a3a4a; }
  #clock { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 3.2em; }
  #time { flex: 1; accent-color: #e8956a; }
  #top { position: fixed; top: 0; left: 0; right: 0; padding: calc(10px + env(safe-area-inset-top)) 12px 0; pointer-events: none;
         display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #family { display: flex; gap: 8px; pointer-events: auto; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: rgba(255,255,255,.7);
          backdrop-filter: blur(8px); box-shadow: 0 1px 4px rgba(0,0,0,.15); font-weight: 600; font-size: 14px; color: #3a3a4a; border: 2px solid transparent; }
  .chip.sel { border-color: #ffb84d; background: #fff; }
  .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; box-shadow: inset 0 -6px 0 rgba(0,0,0,.12); }
  #status { padding: 5px 14px; border-radius: 999px; background: rgba(255,255,255,.7); backdrop-filter: blur(8px); font-size: 13px; color: #3a3a4a; min-height: 1.2em; }
  button { border: 0; border-radius: 999px; padding: 8px 14px; background: #fff; color: #3a3a4a; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
</style>
</head>
<body>
<div id="top"><div id="family"></div><div id="status"></div></div>
<div id="hud">
  <span id="clock">12:00</span>
  <input id="time" type="range" min="0" max="24" step="0.01" value="14">
  <button id="play">Auto</button>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
