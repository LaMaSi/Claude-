<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#cfe6f2">
<title>Little Lives</title>
<style>
  :root { --parch: #f3e8cb; --parch2: #e8d9b3; --ink: #3b2a1e; --edge: #7a5a3a; --gold: #e0a830; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe6f2; font-family: Georgia, 'Palatino Linotype', 'Book Antiqua', serif; color: var(--ink); -webkit-user-select: none; user-select: none; }
  canvas { display: block; touch-action: none; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; }

  /* clock: small, top-right, out of the thumb zone */
  #clockbox { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  #clockrow { display: flex; gap: 6px; }
  .pill { background: var(--parch); border: 2px solid var(--edge); border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: 14px; box-shadow: 0 2px 5px rgba(60,40,20,.25); }
  #clock { font-variant-numeric: tabular-nums; }
  #timepop { display: none; background: var(--parch); border: 2px solid var(--edge); border-radius: 14px; padding: 8px 12px; box-shadow: 0 2px 8px rgba(60,40,20,.3); }
  #timepop.open { display: block; }
  #time { width: 200px; accent-color: #b8433f; }

  /* bottom dock: status, panel, portrait row */
  #dock { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
          padding: 0 10px calc(10px + env(safe-area-inset-bottom)); pointer-events: none; }
  #dock > * { pointer-events: auto; }
  #status { background: rgba(243,232,203,.92); border: 2px solid var(--edge); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-style: italic; box-shadow: 0 2px 5px rgba(60,40,20,.2); }
  #status.hide { display: none; }

  #panel { width: min(100%, 520px); box-sizing: border-box; background: linear-gradient(var(--parch), var(--parch2)); border: 3px solid var(--edge);
           border-radius: 16px; box-shadow: 0 4px 14px rgba(60,40,20,.35), inset 0 0 0 2px rgba(255,255,255,.35); overflow: hidden;
           transform-origin: bottom center; transition: transform .18s ease, opacity .18s ease; }
  #panel.closed { transform: translateY(14px) scale(.96); opacity: 0; pointer-events: none; display: none; }
  #phead { display: flex; align-items: baseline; gap: 8px; padding: 8px 12px 4px; }
  #pname { font-size: 18px; font-weight: 700; }
  #prole { font-size: 12px; opacity: .7; }
  #pact { margin-left: auto; font-size: 12px; font-style: italic; opacity: .85; text-align: right; }
  #pbody { padding: 4px 10px 12px; }
  #needs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .need { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; }
  .need .ico { font-size: 20px; line-height: 1; }
  .need .bar { position: relative; width: 100%; max-width: 38px; height: 62px; background: rgba(59,42,30,.18); border: 2px solid var(--edge); border-radius: 8px; overflow: hidden; }
  .need .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: #6aa84f; transition: height .25s linear, background .25s; }
  .need.low .fill { background: #c0453a; } .need.mid .fill { background: #e0a030; }
  .need.low .bar { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { border-color: #c0453a; } }

  #portraits { display: flex; gap: 12px; justify-content: center; padding: 6px 12px 4px; background: rgba(90,60,38,.88);
               border: 3px solid #3f2a1a; border-radius: 18px; box-shadow: 0 3px 10px rgba(40,25,10,.4); }
  .port { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #f6ead0; font-size: 12px; font-weight: 700; width: 68px; }
  .port .img { width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(#f6e9c8, #d9c392); border: 3px solid #3f2a1a; box-sizing: border-box; overflow: hidden; display: block; }
  .port img { width: 100%; height: 100%; display: block; }
  .port.sel .img { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(224,168,48,.5), 0 0 12px rgba(255,200,80,.7); }
  .port .alert { position: absolute; top: 0; right: 4px; width: 14px; height: 14px; border-radius: 50%; background: #c0453a; border: 2px solid #f6ead0; display: none; }
  .port.warn .alert { display: block; }
</style>
</head>
<body>
<div id="clockbox">
  <div id="clockrow"><button class="pill" id="clock">12:00</button><button class="pill" id="play">Auto</button></div>
  <div id="timepop"><input id="time" type="range" min="0" max="24" step="0.01" value="14"></div>
</div>
<div id="dock">
  <div id="status"></div>
  <div id="panel" class="closed">
    <div id="phead"><span id="pname"></span><span id="prole"></span><span id="pact"></span></div>
    <div id="pbody"><div id="needs"></div></div>
  </div>
  <div id="portraits"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
