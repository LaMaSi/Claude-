<!doctype html>
<html lang="en">
<head>
<script>try{if(!localStorage.getItem('ll.world')&&!/[?&]play=/.test(location.search))location.replace('creator.html')}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c1520">
<title>Little Lives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Nunito+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --wood1: #1d1510; --wood2: #2f2218; --gold: #c9a24c; --goldhi: #f0cd76; --text: #ecdcb4; --dim: #b9a77e; --ink: #0c0806;
          --title: 'Alegreya', 'Palatino Linotype', Georgia, serif; --body: 'Nunito Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1520; font-family: var(--body); color: var(--text); font-weight: 600; -webkit-user-select: none; user-select: none; }
  canvas { display: block; touch-action: none; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; }

  /* soft vignette: cosy, keeps the eye on the cottage */
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 52%, rgba(3,6,12,.6) 100%); }

  /* carved-wood surfaces with a gold inlay line */
  .wood { background: repeating-linear-gradient(92deg, rgba(255,255,255,.025) 0 2px, rgba(0,0,0,.05) 2px 5px), linear-gradient(var(--wood2), var(--wood1));
          border: 2px solid var(--gold); box-shadow: 0 4px 14px rgba(0,0,0,.55), inset 0 0 0 2px rgba(0,0,0,.55), inset 0 0 0 3px rgba(201,162,76,.35); }

  /* clock: small, top-right, out of the thumb zone */
  #clockbox { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  #clockrow { display: flex; gap: 6px; }
  .pill { padding: 5px 13px; border-radius: 999px; font-family: var(--title); font-weight: 800; font-size: 15px; letter-spacing: .03em; color: var(--goldhi); }
  #optbtn { width: 38px; padding: 5px 0; font-size: 19px; line-height: 1; display: flex; align-items: center; justify-content: center; } #optbtn.open { color: #fff1c4; }
  #clock { font-variant-numeric: tabular-nums; }
  #optpop { display: none; border-radius: 14px; padding: 10px 14px 9px; width: 264px; box-sizing: border-box; } #optpop.open { display: block; }
  #optpop .oh { font-family: var(--title); font-weight: 800; font-size: 17px; color: var(--goldhi); margin-bottom: 6px; }
  .orow { white-space: nowrap; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 14px; font-weight: 700; color: var(--text); }
  .sw { width: 46px; height: 26px; border-radius: 999px; background: #120c08; border: 2px solid #6b4f28; position: relative; flex: none; }
  .sw i { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #8c7a55; transition: left .15s, background .15s; }
  .sw[aria-checked=true] { border-color: var(--gold); } .sw[aria-checked=true] i { left: 22px; background: var(--goldhi); }
  .seg { display: inline-flex; border: 2px solid #6b4f28; border-radius: 8px; overflow: hidden; } .seg button { padding: 4px 9px; font-size: 12.5px; font-weight: 800; color: #bfae86; background: #120c08; } .seg button.on { background: var(--gold); color: #1d1510; }
  #pxsizes.off { opacity: .45; pointer-events: none; }
  .ocred { margin-top: 6px; font-size: 10.5px; line-height: 1.3; color: #a99872; font-weight: 600; }
  #timepop { display: none; border-radius: 14px; padding: 9px 13px; }
  #timepop.open { display: block; }
  #time { width: 200px; accent-color: var(--gold); }

  /* bottom dock: status, panel, portrait row */
  #dock { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
          padding: 0 10px calc(10px + env(safe-area-inset-bottom)); pointer-events: none; }
  #dock > * { pointer-events: auto; }
  #status { border-radius: 999px; padding: 4px 14px; font-size: 14px; font-weight: 700; color: #f6ead0; }
  #status.hide { display: none; }

  #panel { width: min(100%, 520px); box-sizing: border-box; border-radius: 16px; overflow: hidden; }
  #panel.closed { display: none; }
  #phead { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px 6px; }
  #pname { font-family: var(--title); font-size: 24px; font-weight: 800; letter-spacing: .02em; color: var(--goldhi); }
  #prole { font-size: 13px; font-weight: 600; color: var(--dim); }
  #pact { margin-left: auto; font-size: 13px; font-weight: 700; color: #f6ead0; text-align: right; }
  #pbody { position: relative; padding: 10px 12px 14px; }
  #pbody::before { content: '❖'; position: absolute; top: -9px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--gold); background: var(--wood1); padding: 0 8px; }
  #pbody::after { content: ''; position: absolute; top: 0; left: 14px; right: 14px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent); }
  #needs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .need { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #d6c59c; }
  .need .ico { width: 30px; height: 30px; font-size: 28px; color: #e2c98a; display: flex; align-items: center; justify-content: center; }
  .need .bar { position: relative; width: 100%; max-width: 34px; height: 62px; background: #120c08; border: 3px solid #6b4f28; border-radius: 5px; overflow: hidden; box-shadow: inset 0 0 0 1px #000, 0 1px 0 rgba(240,205,118,.25); }
  .need .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: #86a35a; transition: height .25s linear; }
  .need .bar::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to top, transparent 0 9px, rgba(8,5,3,.55) 9px 11px); } /* carved measuring notches */
  .need.mid .fill { background: #d09a3c; }
  .need.low .fill { background: #b24a3c; }
  .need.low .bar { animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { border-color: #de5a4c; box-shadow: inset 0 0 0 1px #000, 0 0 8px rgba(222,90,76,.6); } }

  #portraits { display: flex; gap: 12px; justify-content: center; padding: 8px 14px 5px; border-radius: 18px; }
  .port { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: var(--title); color: #cdbb90; font-size: 15px; font-weight: 800; letter-spacing: .02em; width: 68px; }
  .port.sel { color: var(--goldhi); }
  .port .img { width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(#4a3a2c, #1d1510); border: 3px solid #5b4426; box-sizing: border-box; overflow: hidden; display: block; box-shadow: inset 0 0 8px rgba(0,0,0,.7); }
  .port img { width: 100%; height: 100%; display: block; opacity: .93; }
  .port.sel .img { border-color: var(--goldhi); box-shadow: 0 0 0 2px rgba(0,0,0,.6), 0 0 14px rgba(240,205,118,.65); }
  .port .alert { position: absolute; top: 0; right: 4px; width: 13px; height: 13px; border-radius: 50%; background: #de5a4c; border: 2px solid #1d1510; display: none; box-shadow: 0 0 6px rgba(222,90,76,.8); }
  .port.warn .alert { display: block; }

  #panel { display: flex; flex-direction: column; max-height: min(58vh, 430px); }
  #tabs { display: flex; padding: 0 8px; gap: 2px; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 0 4px; border-radius: 10px 10px 0 0; color: #bfae86; opacity: .8; border-bottom: 3px solid transparent; }
  .gi { width: 1em; height: 1em; display: inline-block; vertical-align: -.14em; flex: none; }
  .tab .ti { font-size: 23px; line-height: 1; height: 24px; display: flex; align-items: center; } .tab .tl { font-size: 10.5px; font-weight: 800; }
  .tab.on { color: var(--goldhi); opacity: 1; border-bottom-color: var(--goldhi); background: rgba(240,205,118,.08); }
  #pbody { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  #pbody::before, #pbody::after { display: none; }
  #pbody { border-top: 1px solid rgba(201,162,76,.55); padding: 10px 12px 14px; }
  .moodrow { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 14px; font-weight: 700; }
  .moodrow #moodface { font-size: 24px; } .moodrow .mt { white-space: nowrap; } .moodrow .mt b { color: var(--goldhi); }
  .mbar { flex: 1; height: 12px; background: #120c08; border: 3px solid #6b4f28; border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 0 1px #000; }
  .mbar i { display: block; height: 100%; width: 70%; background: #d9b05a; transition: width .3s; }
  #datetxt { font-family: var(--title); font-weight: 800; font-size: 14px; color: var(--goldhi); margin-bottom: 4px; text-align: center; }

  /* tab content */
  #pane-dyn h4 { margin: 12px 0 6px; font-family: var(--title); font-size: 17px; font-weight: 800; color: var(--goldhi); }
  #pane-dyn h4:first-child { margin-top: 0; } h4 .dim, .dim { color: #b9a77e; font-weight: 600; font-size: 12px; }
  .card { background: rgba(0,0,0,.28); border: 1px solid rgba(201,162,76,.4); border-radius: 12px; padding: 9px 11px; margin-bottom: 8px; font-size: 13px; line-height: 1.35; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; font-size: 13px; }
  .row.card { align-items: flex-start; } .grow { flex: 1; min-width: 0; }
  .nm { color: #f6ead0; font-size: 14px; font-weight: 800; } .note { color: #cdbb90; font-size: 12.5px; margin-top: 2px; }
  .rt { display: flex; align-items: baseline; gap: 8px; } .right { margin-left: auto; } .good { color: #8fd18f; } .bad { color: #e07a6e; }
  .ico { font-size: 22px; width: 28px; text-align: center; } .av { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; border: 2px solid #5b4426; background: radial-gradient(#4a3a2c, #1d1510); flex: none; } .av img { width: 100%; height: 100%; display: block; }
  .mini { height: 9px; background: #120c08; border: 2px solid #6b4f28; border-radius: 3px; overflow: hidden; margin: 5px 0 3px; } .mini i { display: block; height: 100%; background: #86a35a; }
  .mini.heart i { background: #c95a68; } .mini.bad i { background: #a83a32; } .mini.gold i { background: #d9b05a; } .mini.xp i { background: #5f8fb0; }
  .rs { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
  .wish, .step { display: flex; gap: 8px; padding: 6px 4px; font-size: 13.5px; font-weight: 600; border-bottom: 1px dashed rgba(201,162,76,.25); } .step { padding: 3px 0; border: 0; font-size: 13px; }
  .wish .ck, .step .ck { color: var(--goldhi); width: 16px; text-align: center; } .wish.done, .step.done { color: #8fd18f; text-decoration: line-through; opacity: .8; }
  .goal.done { border-color: #f0cd76; } .dream { border-style: dashed; color: #d6c59c; } .bio { font-size: 13.5px; line-height: 1.45; color: #f0e4c4; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px 4px 7px; border-radius: 999px; border: 1.5px solid #8a6a32; background: rgba(0,0,0,.3); font-size: 13px; font-weight: 700; color: #f0e4c4; }
  .chip.good { border-color: #6aae6a; background: rgba(90,160,90,.15); } .chip.bad { border-color: #c0605a; background: rgba(190,80,70,.15); } .chip b { font-size: 15px; }
  .pips { display: flex; gap: 3px; margin: 4px 0 2px; } .pips u { width: 15px; height: 8px; border-radius: 2px; background: rgba(0,0,0,.5); border: 1px solid #8a6a32; } .pips u.on { background: #f0cd76; }
  .kv { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; border-bottom: 1px dashed rgba(201,162,76,.2); } .kv span { color: #cdbb90; }
  .hint { margin: 8px 0 2px; font-size: 12px; color: #a99872; line-height: 1.35; }
  .timeline { position: relative; padding-left: 4px; } .timeline::before { content: ''; position: absolute; left: 17px; top: 6px; bottom: 6px; width: 2px; background: rgba(201,162,76,.35); }
  .ev { display: flex; gap: 10px; padding: 5px 0; font-size: 13px; font-weight: 600; color: #f0e4c4; } .evi { width: 28px; height: 28px; border-radius: 50%; background: #2f2218; border: 2px solid #8a6a32; display: flex; align-items: center; justify-content: center; font-size: 14px; position: relative; flex: none; }
  .ico, .chip b, .evi, .kv span .gi { color: #e2c98a; } .evi .gi { font-size: 15px; } .moodrow #moodface { color: var(--goldhi); display: flex; }
  .evd { font-size: 11.5px; font-weight: 800; color: #b9a77e; }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="clockbox">
  <div id="clockrow"><button class="pill wood" id="clock">21:30</button><button class="pill wood" id="optbtn" title="Options" aria-label="Options"></button><button class="pill wood" id="play">Auto</button></div>
  <div id="optpop" class="wood"><div class="oh">Options</div>
    <div class="orow"><span>Pixel-art look</span><button id="pxsw" class="sw" role="switch" aria-checked="false"><i></i></button></div>
    <div class="orow" id="pxsizes"><span>Pixel size</span><span class="seg"><button data-s="2">Fine</button><button data-s="3">Mid</button><button data-s="4">Chunky</button></span></div>
    <div class="orow"><span>Household</span><button id="newhh" class="pill wood" style="font-size:13px;padding:4px 12px">New household…</button></div>
    <div class="ocred">Icons: game-icons.net by Lorc, Delapouite &amp; contributors (CC BY 3.0)</div></div>
  <div id="timepop" class="wood"><div id="datetxt"></div><input id="time" type="range" min="0" max="24" step="0.01" value="21.5"></div>
</div>
<div id="dock">
  <div id="status" class="wood"></div>
  <div id="panel" class="wood closed">
    <div id="phead"><span id="pname"></span><span id="prole"></span><span id="pact"></span></div>
    <div id="tabs"></div>
    <div id="pbody">
      <div id="pane-needs"><div class="moodrow"><span id="moodface">🙂</span><span class="mt">Mood: <b id="moodtext">Content</b></span><div class="mbar"><i id="moodfill"></i></div></div><div id="needs"></div></div>
      <div id="pane-dyn"></div>
    </div>
  </div>
  <div id="portraits" class="wood"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
