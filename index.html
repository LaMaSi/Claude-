<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c1520">
<title>Little Lives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --wood1: #1d1510; --wood2: #2f2218; --gold: #c9a24c; --goldhi: #f0cd76; --text: #ecdcb4; --dim: #b9a77e; --ink: #0c0806;
          --title: 'Cinzel', 'Palatino Linotype', Georgia, serif; --body: Georgia, 'Palatino Linotype', 'Book Antiqua', serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1520; font-family: var(--body); color: var(--text); -webkit-user-select: none; user-select: none; }
  canvas { display: block; touch-action: none; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; }

  /* soft vignette: cosy, keeps the eye on the cottage */
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 52%, rgba(3,6,12,.6) 100%); }

  /* carved-wood surfaces with a gold inlay line */
  .wood { background: repeating-linear-gradient(92deg, rgba(255,255,255,.025) 0 2px, rgba(0,0,0,.05) 2px 5px), linear-gradient(var(--wood2), var(--wood1));
          border: 2px solid var(--gold); box-shadow: 0 4px 14px rgba(0,0,0,.55), inset 0 0 0 2px rgba(0,0,0,.55), inset 0 0 0 3px rgba(201,162,76,.35); }

  /* clock: small, top-right, out of the thumb zone */
  #clockbox { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  #clockrow { display: flex; gap: 6px; }
  .pill { padding: 5px 13px; border-radius: 999px; font-family: var(--title); font-weight: 700; font-size: 13px; letter-spacing: .05em; color: var(--goldhi); }
  #clock { font-variant-numeric: tabular-nums; }
  #timepop { display: none; border-radius: 14px; padding: 9px 13px; }
  #timepop.open { display: block; }
  #time { width: 200px; accent-color: var(--gold); }

  /* bottom dock: status, panel, portrait row */
  #dock { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
          padding: 0 10px calc(10px + env(safe-area-inset-bottom)); pointer-events: none; }
  #dock > * { pointer-events: auto; }
  #status { border-radius: 999px; padding: 3px 14px; font-size: 13px; font-style: italic; color: var(--text); }
  #status.hide { display: none; }

  #panel { width: min(100%, 520px); box-sizing: border-box; border-radius: 16px; overflow: hidden; }
  #panel.closed { display: none; }
  #phead { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px 6px; }
  #pname { font-family: var(--title); font-size: 19px; font-weight: 700; letter-spacing: .05em; color: var(--goldhi); }
  #prole { font-size: 12px; color: var(--dim); }
  #pact { margin-left: auto; font-size: 12px; font-style: italic; color: var(--text); text-align: right; }
  #pbody { position: relative; padding: 10px 12px 14px; }
  #pbody::before { content: '❖'; position: absolute; top: -9px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--gold); background: var(--wood1); padding: 0 8px; }
  #pbody::after { content: ''; position: absolute; top: 0; left: 14px; right: 14px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent); }
  #needs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .need { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--dim); }
  .need .ico { font-size: 20px; line-height: 1; filter: saturate(.85); }
  .need .bar { position: relative; width: 100%; max-width: 36px; height: 62px; background: rgba(0,0,0,.55); border: 2px solid #8a6a32; border-radius: 10px 10px 8px 8px; overflow: hidden; box-shadow: inset 0 0 6px rgba(0,0,0,.8); }
  .need .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: linear-gradient(90deg, #4f9a5c, #74c47e 45%, #4f9a5c); transition: height .25s linear; }
  .need .bar::after { content: ''; position: absolute; top: 3px; left: 4px; width: 5px; bottom: 6px; border-radius: 4px; background: linear-gradient(rgba(255,255,255,.25), rgba(255,255,255,0)); }
  .need.mid .fill { background: linear-gradient(90deg, #c88a2c, #f0b64a 45%, #c88a2c); }
  .need.low .fill { background: linear-gradient(90deg, #a83a32, #de5a4c 45%, #a83a32); }
  .need.low .bar { animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { border-color: #de5a4c; box-shadow: inset 0 0 6px rgba(0,0,0,.8), 0 0 8px rgba(222,90,76,.6); } }

  #portraits { display: flex; gap: 12px; justify-content: center; padding: 8px 14px 5px; border-radius: 18px; }
  .port { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: var(--title); color: var(--dim); font-size: 11px; font-weight: 700; letter-spacing: .06em; width: 68px; }
  .port.sel { color: var(--goldhi); }
  .port .img { width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(#4a3a2c, #1d1510); border: 3px solid #5b4426; box-sizing: border-box; overflow: hidden; display: block; box-shadow: inset 0 0 8px rgba(0,0,0,.7); }
  .port img { width: 100%; height: 100%; display: block; opacity: .93; }
  .port.sel .img { border-color: var(--goldhi); box-shadow: 0 0 0 2px rgba(0,0,0,.6), 0 0 14px rgba(240,205,118,.65); }
  .port .alert { position: absolute; top: 0; right: 4px; width: 13px; height: 13px; border-radius: 50%; background: #de5a4c; border: 2px solid #1d1510; display: none; box-shadow: 0 0 6px rgba(222,90,76,.8); }
  .port.warn .alert { display: block; }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="clockbox">
  <div id="clockrow"><button class="pill wood" id="clock">21:30</button><button class="pill wood" id="play">Auto</button></div>
  <div id="timepop" class="wood"><input id="time" type="range" min="0" max="24" step="0.01" value="21.5"></div>
</div>
<div id="dock">
  <div id="status" class="wood"></div>
  <div id="panel" class="wood closed">
    <div id="phead"><span id="pname"></span><span id="prole"></span><span id="pact"></span></div>
    <div id="pbody"><div id="needs"></div></div>
  </div>
  <div id="portraits" class="wood"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
